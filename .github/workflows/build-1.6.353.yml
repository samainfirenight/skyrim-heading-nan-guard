name: Build DLL for Skyrim 1.6.353

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ runner.temp }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache dependency binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-2022-static-${{ hashFiles('vcpkg.json', '.github/workflows/build-1.6.353.yml') }}

      - name: Prepare pinned vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          git init "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$env:RUNNER_TEMP/vcpkg" fetch --depth 1 origin 00c5775211f45cd08b37fce0484b4cb940e422ab
          git -C "$env:RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Release x64
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T host=x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile DLL
        run: cmake --build build --config Release --parallel 4

      - name: Verify compiled plugin metadata
        run: |
          python -m pip install pefile==2024.8.26
          python tools/verify_plugin.py build/Release/HeadingNaNGuard.dll

      - name: Package install archive
        shell: pwsh
        run: |
          $package = "dist/package"
          New-Item -ItemType Directory -Force "$package/SKSE/Plugins" | Out-Null
          Copy-Item build/Release/HeadingNaNGuard.dll "$package/SKSE/Plugins/"
          Copy-Item README.md,LICENSE,NOTICE.txt,THIRD-PARTY-LICENSES.txt $package
          Copy-Item extern/CommonLibSSE/COPYING.txt $package
          Copy-Item extern/CommonLibSSE/EXCEPTIONS.md $package
          $commit = git rev-parse HEAD
          "Source: https://github.com/${{ github.repository }}/tree/$commit" | Set-Content "$package/BUILD.txt"
          "Runtime: SkyrimSE.exe 1.6.353.0 (only)" | Add-Content "$package/BUILD.txt"
          Get-FileHash "$package/SKSE/Plugins/HeadingNaNGuard.dll" -Algorithm SHA256 | Format-List | Out-String | Add-Content "$package/BUILD.txt"
          Compress-Archive -Path "$package/*" -DestinationPath dist/HeadingNaNGuard-1.0.2-Skyrim-1.6.353.zip

      - name: Upload DLL archive
        uses: actions/upload-artifact@v4
        with:
          name: HeadingNaNGuard-1.0.2-Skyrim-1.6.353
          path: dist/HeadingNaNGuard-1.0.2-Skyrim-1.6.353.zip
          if-no-files-found: error
          retention-days: 90
